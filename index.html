<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>暇つぶしWiki</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="暇つぶしWiki トップ">暇つぶしWiki</a>
    <div class="top-actions">
      <span id="role-label" class="role-label"></span>
      <button id="logout-btn" class="quiet-button" type="button">ログアウト</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a href="#home">メインページ</a>
        <a href="#category/メンバー">メンバー一覧</a>
        <a href="#category/グループ">グループについて</a>
        <a href="#category/エピソード">エピソード</a>
        <a href="#category/用語">用語集</a>
      </nav>
      <div class="side-note">暇つぶしグループの非公開Wiki</div>
    </aside>
    <main class="main">
      <div class="page-heading">
        <div>
          <div class="eyebrow">PRIVATE ENCYCLOPEDIA</div>
          <h1 id="page-title">メインページ</h1>
        </div>
        <button id="new-article" class="primary-button hidden" type="button">＋ 新しい記事</button>
      </div>
      <div class="search-row">
        <input id="search" type="search" placeholder="Wiki内を検索" aria-label="Wiki内を検索">
        <button id="search-btn" type="button">検索</button>
      </div>
      <section id="notice" class="notice hidden" role="status"></section>
      <section id="content"></section>
      <section id="editor" class="editor hidden">
        <h2 id="editor-title">記事を作成</h2>
        <form id="article-form">
          <label>記事タイトル<input id="article-title" maxlength="80" required></label>
          <label>分類
            <select id="article-category">
              <option>メンバー</option><option>グループ</option><option>エピソード</option><option>用語</option><option>その他</option>
            </select>
          </label>
          <label>本文<textarea id="article-body" rows="12" maxlength="12000" placeholder="記事の内容を入力。改行も保存されます。" required></textarea></label>
          <div class="form-actions">
            <button class="primary-button" type="submit">保存</button>
            <button id="cancel-edit" class="quiet-button" type="button">キャンセル</button>
          </div>
        </form>
      </section>
      <footer>このWikiは招待された人だけが閲覧できます。</footer>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
