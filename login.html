<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - 暇つぶしWiki</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="eyebrow">PRIVATE ENCYCLOPEDIA</div>
    <h1>暇つぶしWiki</h1>
    <p>閲覧用または編集用のパスワードを入力してください。</p>
    <form id="login-form">
      <label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary-button full" type="submit">ログイン</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
